server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # sendfile + faixas de bytes: e' o que faz arrastar a barra do player pular
    # direto para o trecho pedido em vez de baixar o mp4 inteiro. O nginx serve
    # Range por padrao; sem sendfile/tcp_nopush o trecho chega em pedacos miudos.
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;
    # NAO comprimir mp4/jpg/webp: ja' vem comprimido, gzip so' gastaria CPU e nao
    # tiraria um byte.

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # os videos e as capas nunca mudam de conteudo sem mudar de nome
    location ~* \.(mp4|webp|jpg|jpeg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # a pagina em si e' pequena e muda a cada publicacao
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
